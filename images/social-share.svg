<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f35;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2f45;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:0.15" />
      <stop offset="25%" style="stop-color:#A855F7;stop-opacity:0.1" />
      <stop offset="70%" style="stop-color:#A855F7;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.1" />
      <stop offset="70%" style="stop-color:#FBBF24;stop-opacity:0" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative orbs -->
  <circle cx="1100" cy="100" r="400" fill="url(#orb1)"/>
  <circle cx="200" cy="550" r="300" fill="url(#orb2)"/>

  <!-- Content -->
  <g transform="translate(80, 0)">
    <!-- Logo -->
    <text x="0" y="200" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="url(#textGradient)" letter-spacing="-0.5">
      Impulse Card
    </text>

    <!-- Headline -->
    <text x="0" y="290" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#FAFAFA" letter-spacing="-2">
      <tspan x="0" dy="0">Stop impulse spending</tspan>
    </text>
    <text x="0" y="375" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="url(#textGradient)" letter-spacing="-2">
      <tspan x="0" dy="0">before it happens</tspan>
    </text>

    <!-- Subheadline -->
    <text x="0" y="440" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#B0B8CC">
      <tspan x="0" dy="0">AI-powered spending control for your wallet</tspan>
    </text>

    <!-- CTA Pill -->
    <g transform="translate(0, 475)">
      <rect x="0" y="0" width="360" height="60" rx="30" fill="rgba(192, 132, 252, 0.1)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="2"/>
      <text x="30" y="40" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#C084FC">
        🎯 Join the waitlist
      </text>
    </g>
  </g>

  <!-- Card Mockup -->
  <g transform="translate(740, 195) rotate(5 190 120)">
    <!-- Card shadow -->
    <rect x="5" y="5" width="380" height="240" rx="20" fill="rgba(0,0,0,0.3)" filter="url(#glow)"/>

    <!-- Card body -->
    <rect x="0" y="0" width="380" height="240" rx="20" fill="url(#cardGradient)" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1"/>

    <!-- Inner glow -->
    <rect x="1" y="1" width="378" height="238" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

    <!-- Card chip -->
    <rect x="30" y="30" width="50" height="40" rx="8" fill="url(#chipGradient)" opacity="0.8"/>

    <!-- Card number -->
    <text x="30" y="145" font-family="monospace" font-size="22" font-weight="600" fill="#FAFAFA" letter-spacing="3">
      •••• •••• •••• 4321
    </text>

    <!-- Card name -->
    <text x="30" y="195" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#B0B8CC" letter-spacing="1">
      IMPULSE CARD
    </text>
  </g>
</svg>
