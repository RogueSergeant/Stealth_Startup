<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulse Card</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #ffffff;
            color: #1f2937;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2563eb;
        }

        p {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Impulse Card</h1>
        <p>Site under development</p>
    </div>
</body>
</html>
